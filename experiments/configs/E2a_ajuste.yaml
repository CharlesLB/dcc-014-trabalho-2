campanha: E2a-ajuste
bases: [parkinson, wpbc, qadc]
classificadores: [DA]
variantes: [MST_FREQ]
folds: todos
sementes: [0, 1]
params: {beta: 0.99, alpha: 0.99, scale_base: casos}
