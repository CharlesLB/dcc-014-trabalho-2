# Diagnóstico (não faz parte da SPEC): MST com a regra de DA do código Pascal
# público (corte no ponto médio, a priori iguais). Serve só para explicar a
# diferença entre o f do E1 e a Tabela 3 do artigo. O E1 oficial usa DA.
campanha: E1b-diagnostico-DA_PASCAL
bases: [parkinson, qadc, spectf, wdbc, wpbc, alzheimer, cervical, glioma, mesothelioma]
classificadores: [DA_PASCAL]
variantes: [MST]
folds: todos
sementes: [0]
params: {beta: 0.99, alpha: 0.99, scale_base: variaveis, maxiter_ms: 10, outer_stop_strict: false}
n_jobs: 7          # Ryzen 7 (8 núcleos): 7 processos; "auto" = núcleos físicos − 1
blas_threads: 1    # uma thread de BLAS por processo
