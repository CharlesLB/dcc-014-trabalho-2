# SPEC §6.1: reprodução do MST com DA nas nove bases (450 execuções).
campanha: E1-reproducao-DA
bases: [parkinson, qadc, spectf, wdbc, wpbc, alzheimer, cervical, glioma, mesothelioma]
classificadores: [DA]
variantes: [MST]
folds: todos
sementes: [0, 1, 2, 3, 4]
params: {beta: 0.99, alpha: 0.99, scale_base: casos, maxiter_ms: 10, outer_stop_strict: false}
n_jobs: 7          # Ryzen 7 (8 núcleos): 7 processos; "auto" = núcleos físicos − 1
blas_threads: 1    # uma thread de BLAS por processo
