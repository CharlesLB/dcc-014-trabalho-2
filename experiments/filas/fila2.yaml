# Fila 2 (25/11, 01:15): prazo 12:00. Prioridade aos números comparáveis com o artigo.
# Relida a cada minuto por experiments.fila (pode ser editada com a fila rodando).
n_jobs: 31
blas_threads: 1
custo_base: {qadc: 1000, spectf: 100, wpbc: 20, wdbc: 20, mesothelioma: 20, alzheimer: 12, cervical: 8, parkinson: 7, glioma: 3}
entradas:
  - config: experiments/configs/E2a_ajuste.yaml
    prioridade: 0
  - config: experiments/configs/E1_casos.yaml
    prioridade: 1
  - config: experiments/configs/E4_baselines.yaml
    set: ["sementes=[0]", "tempo_de=results/E2-P1/runs.jsonl"]
    prioridade: 1
  - config: experiments/configs/E4_outros_classificadores.yaml
    set: ["variantes=[MST]", "classificadores=[LR]", "bases=[parkinson, spectf, wdbc, wpbc, alzheimer, cervical, glioma, mesothelioma]"]
    prioridade: 2
  - config: experiments/configs/E4_outros_classificadores.yaml
    set: ["variantes=[MST]", "classificadores=[SVM]", "bases=[parkinson, wdbc, wpbc, alzheimer, cervical, glioma, mesothelioma]"]
    prioridade: 2
  - config: experiments/configs/E2_P2.yaml
    set: ["variantes=[GULOSO, MST]", "sementes=[0, 1, 2]"]
    prioridade: 3
  - config: experiments/configs/E3_ablacoes.yaml
    set: ["sementes=[0, 1, 2]"]
    prioridade: 3
  - config: experiments/configs/E4_outros_classificadores.yaml
    set: ["variantes=[MST]", "classificadores=[SVM]", "bases=[spectf]"]
    prioridade: 9
